backend:
  name: git-gateway
  repo: jhiannyhilton-dev/nines-makeup
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/328b5874-6c59-424c-a0da-fc556c620cbd/pkce
  auth_token_endpoint: /sites/328b5874-6c59-424c-a0da-fc556c620cbd/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Las fotos que subas desde el CMS se guardan aquí y se sirven directo del sitio
media_folder: "uploads"
public_folder: "/uploads"

site_url: https://ninesmakeup.netlify.app
display_url: https://ninesmakeup.netlify.app

collections:
  - name: "productos"
    label: "Productos"
    files:
      - name: "productos"
        label: "Catálogo de productos"
        file: "data/products.json"
        format: "json"
        fields:
          - label: "Productos"
            name: "productos"
            widget: "list"
            summary: "{{fields.brand}} — {{fields.name}} ({{fields.cat}})"
            fields:
              - { label: "ID (no cambiar en productos existentes)", name: "id", widget: "string" }
              - { label: "Marca", name: "brand", widget: "string" }
              - { label: "Nombre del producto", name: "name", widget: "string" }
              - label: "Categoría"
                name: "cat"
                widget: "select"
                options:
                  - { label: "Rostro", value: "rostro" }
                  - { label: "Labios", value: "labios" }
                  - { label: "Ojos", value: "ojos" }
                  - { label: "Skincare", value: "skincare" }
                  - { label: "Cabello", value: "cabello" }
                  - { label: "Fragancias", value: "fragancias" }
              - { label: "Tamaño / presentación", name: "spec", widget: "string", required: false }
              - { label: "Precio normal (RD$, 0 = pendiente)", name: "price", widget: "number", value_type: "int", default: 0 }
              - { label: "Foto del producto", name: "img", widget: "image", required: false, hint: "Si la dejas vacía se muestra un ícono con la inicial de la marca." }
              - { label: "Variantes / tonos", name: "variants", widget: "list", required: false, summary: "{{fields.name}}", fields: [
                  { label: "Nombre del tono", name: "name", widget: "string" },
                  { label: "Foto de este tono (opcional)", name: "img", widget: "image", required: false, hint: "Si la dejas vacía se usa la foto principal del producto." }
                ] }
              - { label: "Nota de costo mayorista (referencia interna)", name: "cost", widget: "string", required: false }
              - { label: "Precio de oferta RD$ (0 = sin oferta)", name: "salePrice", widget: "number", value_type: "int", default: 0, hint: "Si pones aquí un precio menor al normal, el producto aparece en Ofertas / Bazaar." }
              - { label: "La oferta termina (opcional)", name: "saleEndsAt", widget: "datetime", required: false, hint: "Deja vacío para que la oferta no venza sola. Actívala poniendo un precio de oferta arriba." }

  - name: "portada"
    label: "Portada (fotos del home)"
    files:
      - name: "home"
        label: "Fotos de la página principal"
        file: "data/home.json"
        format: "json"
        fields:
          - { label: "Foto principal del banner de arriba (hero)", name: "heroMain", widget: "image", required: false, hint: "Usa PNG con fondo transparente — el producto se ve flotando sin caja alrededor." }
          - { label: "Foto destacada — paso 1 de 3 (círculo 'Nine's Pick')", name: "showcase1", widget: "image", required: false, hint: "PNG con fondo transparente. Si solo llenas esta, los pasos 2 y 3 la reusan automáticamente." }
          - { label: "Foto destacada — paso 2 de 3", name: "showcase2", widget: "image", required: false }
          - { label: "Foto destacada — paso 3 de 3", name: "showcase3", widget: "image", required: false }
          - label: "Favoritos de Nine's (4 productos del catálogo)"
            name: "editPicks"
            widget: "list"
            hint: "Escribe el ID exacto de cada producto (lo ves en la pestaña Productos, arriba de cada ficha, ej. rb-076). El nombre, marca, foto y precio se toman solos del catálogo — no hace falta subir fotos aquí."
            field: { label: "ID del producto", name: "id", widget: "string" }
          - label: "Favoritos de la semana (página aparte, 3 productos)"
            name: "weeklyFavorites"
            widget: "list"
            summary: "{{fields.id}}"
            hint: "Los 3 productos que aparecen en la página 'Favoritos de la semana' (a la que lleva el botón 'Descubrir el favorito' del home)."
            fields:
              - { label: "ID del producto", name: "id", widget: "string" }
              - { label: "Por qué es favorito (una frase corta)", name: "blurb", widget: "text", required: false }
          - { label: "Foto de la sección 'La tienda se siente como una marca'", name: "editorial", widget: "image", required: false, hint: "PNG con fondo transparente para mejor resultado." }
          - { label: "Foto del mensaje de bienvenida (10% off)", name: "welcomeImage", widget: "image", required: false, hint: "Foto normal, con fondo — se muestra a la izquierda del mensaje de bienvenida. Si la dejas vacía, se usa un fondo de color." }

  - name: "tienda"
    label: "Configuración de la tienda"
    files:
      - name: "sitio"
        label: "Datos generales, zonas de envío y marcas"
        file: "data/site.json"
        format: "json"
        fields:
          - label: "Tienda"
            name: "SHOP"
            widget: "object"
            fields:
              - { label: "WhatsApp (con código de país, ej. 18098862048)", name: "whatsapp", widget: "string" }
              - { label: "Dirección de la tienda", name: "address", widget: "string" }
              - { label: "Símbolo de moneda", name: "currency", widget: "string" }
              - { label: "Música de fondo — MP3 (opcional)", name: "music", widget: "file", required: false, hint: "Solo úsalo si NO vas a usar la playlist de Spotify de abajo. Sube un MP3 corto (2-4 min) libre de derechos." }
              - { label: "Tu playlist de Spotify (opcional)", name: "spotifyPlaylist", widget: "string", required: false, hint: "Solo se usa si el campo de YouTube de abajo está vacío. Corta las canciones a 30 seg si el cliente no tiene sesión de Spotify iniciada — es una restricción de Spotify, no nuestra." }
              - { label: "Tu playlist de YouTube Music (recomendado, reproduce canciones completas)", name: "youtubePlaylist", widget: "string", required: false, hint: "Pega el link para compartir de tu playlist (YouTube Music → los 3 puntos → Compartir → Copiar enlace). Tiene prioridad sobre Spotify si llenas los dos." }
          - label: "Zonas de envío"
            name: "ZONES"
            widget: "list"
            summary: "{{fields.name}} — RD$ {{fields.fee}}"
            fields:
              - { label: "ID interno (no cambiar)", name: "id", widget: "string" }
              - { label: "Nombre de la zona", name: "name", widget: "string" }
              - { label: "Costo de envío (vacío = a cotizar)", name: "fee", widget: "number", value_type: "int", required: false }
          - label: "Categorías del menú"
            name: "CATEGORIES"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Slug (no cambiar)", name: "slug", widget: "string" }
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Descripción corta", name: "note", widget: "string" }
              - { label: "Página a la que enlaza (no cambiar)", name: "href", widget: "string" }
              - { label: "Foto de portada de la categoría", name: "img", widget: "image", required: false, hint: "Puedes subirla desde tu computadora, elegirla de la galería de medios, o pegar una URL. Si la dejas vacía, se muestra un color de fondo." }
          - label: "Marca destacada del banner (home)"
            name: "FEATURED"
            widget: "object"
            fields:
              - { label: "Nombre de la marca", name: "key", widget: "string" }
              - { label: "Etiqueta pequeña", name: "eyebrow", widget: "string" }
              - { label: "Título", name: "headline", widget: "string" }
              - { label: "Texto", name: "text", widget: "text" }
              - { label: "Categoría a la que enlaza", name: "cat", widget: "string" }
          - label: "Marcas destacadas"
            name: "BRANDS"
            widget: "list"
            summary: "{{fields.key}}"
            fields:
              - { label: "Nombre", name: "key", widget: "string" }
              - { label: "Etiqueta", name: "tag", widget: "string" }
              - { label: "Texto", name: "text", widget: "string" }
              - { label: "Categoría", name: "cat", widget: "string" }
